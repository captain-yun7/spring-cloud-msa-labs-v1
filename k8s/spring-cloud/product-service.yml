apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: spring-cloud-msa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      imagePullSecrets:
      - name: ecr-registry-secret
      containers:
      - name: product-service
        image: 857360183365.dkr.ecr.ap-northeast-2.amazonaws.com/spring-cloud-msa/product-service:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 8082
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: SPRING_CONFIG_IMPORT
          value: ""
        - name: SPRING_CLOUD_CONFIG_ENABLED
          value: "false"
        - name: SPRING_CLOUD_CONFIG_IMPORT_CHECK_ENABLED
          value: "false"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: common-secret
              key: mysql-username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: common-secret
              key: mysql-password
        - name: SPRING_RABBITMQ_USERNAME
          valueFrom:
            secretKeyRef:
              name: common-secret
              key: rabbitmq-username
        - name: SPRING_RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: common-secret
              key: rabbitmq-password
        envFrom:
        - configMapRef:
            name: common-config
        - configMapRef:
            name: product-service-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 120
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8082
          initialDelaySeconds: 60
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: product-service-service
  namespace: spring-cloud-msa
spec:
  selector:
    app: product-service
  ports:
  - name: http
    port: 8082
    targetPort: 8082
  type: ClusterIP