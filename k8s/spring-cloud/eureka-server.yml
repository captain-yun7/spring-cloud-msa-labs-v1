apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
  namespace: spring-cloud-msa
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      imagePullSecrets:
      - name: ecr-registry-secret
      containers:
      - name: eureka-server
        image: 857360183365.dkr.ecr.ap-northeast-2.amazonaws.com/spring-cloud-msa/eureka-server:v2
        ports:
        - containerPort: 8761
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: SPRING_CLOUD_CONFIG_ENABLED
          value: "false"
        - name: SPRING_CLOUD_CONFIG_IMPORT_CHECK_ENABLED
          value: "false"
        - name: SPRING_CONFIG_IMPORT
          value: ""
        envFrom:
        - configMapRef:
            name: eureka-server-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8761
          initialDelaySeconds: 90
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8761
          initialDelaySeconds: 45
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server-service
  namespace: spring-cloud-msa
spec:
  selector:
    app: eureka-server
  ports:
  - name: http
    port: 8761
    targetPort: 8761
  type: ClusterIP