apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: spring-cloud-msa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      imagePullSecrets:
      - name: ecr-registry-secret
      containers:
      - name: api-gateway
        image: 857360183365.dkr.ecr.ap-northeast-2.amazonaws.com/spring-cloud-msa/api-gateway:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: SPRING_CONFIG_IMPORT
          value: ""
        - name: SPRING_CLOUD_CONFIG_ENABLED
          value: "false"
        - name: SPRING_CLOUD_CONFIG_IMPORT_CHECK_ENABLED
          value: "false"
        envFrom:
        - configMapRef:
            name: common-config
        - configMapRef:
            name: api-gateway-config
        volumeMounts:
        - name: config-volume
          mountPath: /workspace/application.yml
          subPath: application.yml
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
      volumes:
      - name: config-volume
        configMap:
          name: api-gateway-config

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: spring-cloud-msa
spec:
  selector:
    app: api-gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: LoadBalancer