apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: spring-cloud-msa
data:
  # 서비스 설정
  server.port: "8081"
  spring.application.name: "user-service"
  spring.datasource.url: "jdbc:mysql://mysql-service:3306/user_service_db"
  
  # 사용자 서비스 메타데이터
  user.service.name: "User Service"
  user.service.version: "2.0"
  user.service.description: "사용자 정보를 관리하는 마이크로서비스"