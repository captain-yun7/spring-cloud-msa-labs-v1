apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: spring-cloud-msa
data:
  # 서비스 설정
  server.port: "8083"
  spring.application.name: "order-service"
  spring.datasource.url: "jdbc:mysql://mysql-service:3306/order_service_db"
  
  # Resilience4j Circuit Breaker 설정
  resilience4j.circuitbreaker.circuit-breaker-aspect-order: "1"
  resilience4j.circuitbreaker.instances.user-service.sliding-window-type: "count-based"
  resilience4j.circuitbreaker.instances.user-service.sliding-window-size: "3"
  resilience4j.circuitbreaker.instances.user-service.minimum-number-of-calls: "3"
  resilience4j.circuitbreaker.instances.user-service.failure-rate-threshold: "50"
  resilience4j.circuitbreaker.instances.user-service.permitted-number-of-calls-in-half-open-state: "2"
  
  # Resilience4j Retry 설정
  resilience4j.retry.retry-aspect-order: "2"
  resilience4j.retry.instances.user-service.max-attempts: "2"
  resilience4j.retry.instances.user-service.wait-duration: "1s"
  
  # 추가 관리 엔드포인트
  management.endpoints.web.exposure.include: "health,info,circuitbreakers,circuitbreakerevents"
  management.endpoint.health.show-details: "always"
  management.health.circuitbreakers.enabled: "true"